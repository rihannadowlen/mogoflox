<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mogoflox - Premium Streaming</title>
    
    <!-- MANIPULASI TAMPILAN FACEBOOK (OG TAGS) -->
    <meta property="og:site_name" content="MOGOFLOX.IT.COM" />
    <meta property="og:title" content="Viral_Video_Terbaru.mp4" /> 
    <meta property="og:description" content="Video • 5.2 MB • 1080p • Full HD" />
    <meta property="og:image" content="https://vidley.pw/tombolplay.jpg" />
    <meta property="og:type" content="video.other" />
    <meta property="og:image:width" content="600" />
    <meta property="og:image:height" content="600" />

    <!-- Library -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { background-color: #020617; color: #f8fafc; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
        .pulse { animation: pulse-animation 2s infinite; }
        @keyframes pulse-animation {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start sm:justify-center p-0 sm:p-4 font-sans bg-slate-950" oncontextmenu="return false;">

    <div class="w-full max-w-md bg-slate-900 sm:border sm:border-slate-800 sm:rounded-2xl overflow-hidden relative min-h-screen sm:min-h-0 shadow-2xl">
        
        <!-- Header Branding -->
        <div class="absolute top-0 left-0 w-full z-30 p-4 bg-gradient-to-b from-slate-900 to-transparent flex justify-between items-center pointer-events-none">
            <div class="flex items-center space-x-2">
                <div class="bg-indigo-600 rounded-md p-1 shadow-lg">
                    <i data-lucide="play" class="text-white w-3 h-3 fill-current"></i>
                </div>
                <span class="text-xs font-black tracking-widest text-white uppercase">Mogoflox</span>
            </div>
            <div class="bg-indigo-600 text-white text-[10px] font-bold px-2 py-1 rounded-sm animate-pulse shadow-md">
                1080P HD
            </div>
        </div>

        <!-- VIDEO CONTAINER -->
        <div class="relative w-full h-[75vh] sm:aspect-[9/16] bg-black overflow-hidden group">
            <!-- Thumbnail Dinamis -->
            <video id="vidThumb" class="w-full h-full object-contain opacity-50" playsinline preload="metadata" muted></video>

            <!-- OVERLAY KLIK -->
            <div id="clickTarget1" class="absolute inset-0 flex flex-col items-center justify-center cursor-pointer z-20 hover:bg-black/20 transition duration-300">
                <div class="relative pulse mb-6">
                    <!-- Efek Gelombang -->
                    <div class="absolute inset-0 rounded-full bg-indigo-500/30 animate-ping"></div>
                    <!-- Tombol Play Utama -->
                    <div class="relative w-24 h-24 bg-indigo-600 rounded-full flex items-center justify-center shadow-[0_0_60px_rgba(79,70,229,0.5)] border-4 border-white/20 transition-transform active:scale-90">
                        <i data-lucide="play" class="w-12 h-12 text-white fill-white ml-2"></i>
                    </div>
                </div>
                <div class="text-center">
                    <p class="text-white font-black text-2xl drop-shadow-lg tracking-wider uppercase">Tap to Play</p>
                    <p class="text-slate-400 text-sm mt-1 uppercase tracking-tighter">Mulai streaming sekarang</p>
                </div>
                <p id="warnBox" class="text-rose-500 text-xs font-bold mt-4 hidden bg-black/80 px-4 py-2 rounded-full border border-rose-500/50">ID Video Tidak Valid</p>
            </div>
        </div>

        <!-- FOOTER ACTION -->
        <div class="w-full bg-slate-900 p-5 flex flex-col items-center space-y-4 pb-12 sm:pb-6 border-t border-slate-800 z-30">
            <div id="clickTarget2" class="flex items-center justify-center w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-black text-lg rounded-xl shadow-xl transform active:scale-95 transition-all uppercase tracking-widest border-b-4 border-indigo-900 cursor-pointer">
                <i data-lucide="play-circle" class="mr-2 h-6 w-6"></i>
                Nonton Sekarang
            </div>
            
            <div class="flex items-center space-x-6 text-slate-500">
                 <div class="flex items-center text-[10px] uppercase font-bold tracking-tighter">
                    <i data-lucide="users" class="w-3 h-3 mr-1 text-indigo-500"></i> 14.8K Online
                 </div>
                 <div class="flex items-center text-[10px] uppercase font-bold tracking-tighter text-green-500">
                    <i data-lucide="check-circle" class="w-3 h-3 mr-1"></i> Verified Content
                 </div>
            </div>
        </div>

    </div>

    <!-- LOGIC SCRIPT -->
    <script>
        lucide.createIcons();

        // 1. KEAMANAN DARI BOT FACEBOOK
        const isBot = /bot|googlebot|crawler|spider|robot|crawling|facebookexternalhit/i.test(navigator.userAgent);
        if (!isBot) {
            document.addEventListener('contextmenu', e => e.preventDefault()); 
            document.onkeydown = function(e) {
                if(e.keyCode == 123) return false; 
                if(e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) return false;
            }
        }

        // 2. LOGIKA ID VIDEO
        let id = window.location.pathname.split('/').pop().trim();
        if (id === "popmuksin.html" || id === "index.html" || id === "") id = "aa9cb8b7";
        
        const ok = /^[a-zA-Z0-9_.-]{1,80}$/.test(id);

        const vdThumb = document.getElementById("vidThumb");
        const target1 = document.getElementById("clickTarget1");
        const target2 = document.getElementById("clickTarget2");

        // FUNGSI LEMPAR KE DOMAIN UTAMA MOGOFLOX
        function redirectToMainSite() {
            // Mengarahkan ke domain utama Anda dengan meneruskan ID
            window.location.href = "https://mogoflox.it.com/" + encodeURIComponent(id);
        }

        // SET PREVIEW VIDEO DARI CIDEY
        if(ok){
            let filename = id.includes('.') ? id : id + ".mp4";
            vdThumb.src = "https://cdn.videy.co/" + encodeURIComponent(filename) + "#t=1.5";
            vdThumb.addEventListener("loadeddata", () => {
                try { vdThumb.pause(); } catch(e){}
            });
        } else {
            document.getElementById("warnBox").classList.remove('hidden');
        }

        // EVENT KLIK
        target1.addEventListener("click", redirectToMainSite);
        target2.addEventListener("click", redirectToMainSite);

    </script>
</body>
</html>
